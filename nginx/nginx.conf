worker_processes auto;

events {
    worker_connections 4096;
}

http {
    # Use resolver (required for variable resolution)
    resolver 127.0.0.11 valid=30s;  # Docker's internal DNS

    server_tokens off;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;
    limit_req_status 429;

    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    limit_conn_status 429;

    client_body_buffer_size 128k; 
    client_max_body_size 2m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;

    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;
    
    # Main server block
    server {
        listen 4350;
        server_name _;

        # Include the current environment setting
        include /etc/nginx/current_env.conf;

        # GLOBAL PROXY SETTINGS
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Per-IP limits (apply to all locations in this server).
        # nodelay keeps NAT bursts snappy; sustained abuse is bounded by `rate`.
        limit_conn conn_limit 100;
        limit_req zone=api_limit burst=400 nodelay;

        # Main endpoint - routes to active environment
        location / {
            set $upstream_host "${app_servers}-graphql:8080";
            proxy_pass http://$upstream_host;
        }

        # Direct access to blue environment
        location /blue/ {
            set $upstream_host "blue-graphql:8080";
            rewrite ^/blue/(.*)$ /$1 break;
            proxy_pass http://$upstream_host;
        }
        
        # Direct access to green environment
        location /green/ {
            set $upstream_host "green-graphql:8080";
            rewrite ^/green/(.*)$ /$1 break;
            proxy_pass http://$upstream_host;
        }

        # Health check endpoint
        location /health {
            add_header Content-Type application/json;
            return 200 '{"status": "healthy", "active_environment": "$app_servers"}';
        }

        # Environment status endpoint
        location /status {
            add_header Content-Type application/json;
            return 200 '{"active_environment": "$app_servers", "blue_endpoint": "/blue/v1/graphql", "green_endpoint": "/green/v1/graphql"}';
        }
    }

    # Prometheus server block
    server {
        listen 9090;
        server_name _;

        # Include the current environment setting
        include /etc/nginx/current_env.conf;

        location / {
            set $upstream_host "${app_servers}-processor:9090";
            proxy_pass http://$upstream_host;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }
}